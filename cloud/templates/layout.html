<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Karaoke ni Lakay Owner{% endblock %}</title>
  <style>
    /* The venue app's palette (pikaraoke/static/bulma-dark.css): flag blue chrome,
       the sun's gold for actions, red kept for trouble. */
    :root {
      --bg: #0a1430; --panel: #111e42; --panel-2: #182853; --border: #34467a;
      --text: #ffffff; --muted: #94a1c2; --blue: #0038a8; --blue-hover: #1a4fc4;
      --gold: #fcd116; --on-gold: #0a1430; --red: #ce1126; --green: #2ecc71;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text);
      font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    header.top { background: var(--blue); box-shadow: inset 0 -4px 0 var(--red);
      padding: 16px 24px 20px; display: flex; align-items: center; justify-content: space-between; }
    header.top h1 { margin: 0; font-size: 20px; }
    header.top h1 span { color: var(--gold); }
    main { max-width: 1100px; margin: 0 auto; padding: 24px 16px 64px; }
    a { color: var(--gold); }
    .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-bottom: 20px; }
    .stats { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 20px; }
    .stat { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 12px 18px; min-width: 120px; }
    .stat b { display: block; font-size: 26px; }
    .stat.alert { background: #3a1420; border-color: var(--red); color: #ffb3bd; }
    .venue-head { display: flex; flex-wrap: wrap; gap: 8px; justify-content: space-between; align-items: flex-start; }
    .venue-head h2 { margin: 0 0 2px; font-size: 21px; }
    .badges { display: flex; gap: 6px; flex-wrap: wrap; }
    .badge { border: 1px solid var(--border); border-radius: 99px; padding: 3px 12px; font-size: 13px; font-weight: 600; }
    .badge.warn { background: #3d3208; border-color: #6b5a10; color: var(--gold); }
    .badge.read_only, .badge.down { background: #3a1420; border-color: var(--red); color: #ffb3bd; }
    .badge.full, .badge.running { color: var(--green); }
    .notice { border-radius: 8px; padding: 10px 14px; margin: 14px 0; }
    .notice.warn { background: #3d3208; color: var(--gold); }
    .notice.read_only { background: #3a1420; color: #ffb3bd; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px 20px; margin: 16px 0; }
    .grid small { display: block; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; font-size: 12px; }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; }
    .actions form { margin: 0; }
    button, .button { background: var(--panel-2); color: var(--text); border: 1px solid var(--border);
      border-radius: 8px; padding: 9px 16px; font: inherit; font-weight: 600; cursor: pointer; }
    button:hover { border-color: var(--muted); }
    button.primary { background: var(--blue); border-color: var(--blue); }
    button.primary:hover { background: var(--blue-hover); }
    button.danger { color: #ffb3bd; }
    details { margin-top: 8px; }
    summary { cursor: pointer; color: var(--gold); font-weight: 600; padding: 4px 0; }
    form.fields { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; margin-top: 12px; align-items: end; }
    label { display: block; color: var(--muted); font-size: 14px; }
    input, select { width: 100%; margin-top: 4px; padding: 9px 10px; border-radius: 8px; border: 1px solid var(--border);
      background: #fff; color: #0a1430; font: inherit; }
    .flash { border-radius: 8px; padding: 10px 14px; margin-bottom: 16px; background: #123a24; color: #b6f2cc; }
    .flash.error { background: #3a1420; color: #ffb3bd; }
    .muted { color: var(--muted); }
    @media (max-width: 600px) { header.top { padding: 14px 16px 18px; } }
  </style>
</head>
<body>
  <header class="top">
    <h1>Karaoke <span>ni Lakay</span> Owner</h1>
    {% block header_action %}{% endblock %}
  </header>
  <main>
    {% for category, message in get_flashed_messages(with_categories=true) %}
    <div class="flash {{ category }}">{{ message }}</div>
    {% endfor %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
